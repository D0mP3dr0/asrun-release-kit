[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asrun"
version = "0.1.0"
description = "Publish research code as it ran, with code and payload identity checks"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Luis Felipe Comodo Seelig"}]
dependencies = ["PyYAML>=5.1"]
keywords = ["reproducibility", "research software", "provenance", "open science"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
asrun = "asrun.cli:main"

[tool.setuptools]
packages = ["asrun"]

[tool.setuptools.package-data]
asrun = ["templates/*.py"]
